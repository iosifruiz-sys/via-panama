<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vía Panamá"><link rel="manifest" href="manifest.webmanifest"><title>Vía Panamá</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#101b2f;color:#eef6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#293a5a,#101b2f 55%);min-height:100dvh}.wrap{max-width:580px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 105px}h1{font-size:34px;margin:14px 0 6px}h2{font-size:22px}.muted{color:#a9b9ce;line-height:1.5}.brand{font-size:24px;font-weight:850;letter-spacing:-.7px}.brand em{color:#74ecc6;font-style:normal}.panel,.flash{background:#1c2a42;border:1px solid #344663;border-radius:20px;padding:22px;margin:16px 0}.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}.question{font-size:24px;font-weight:750;line-height:1.35}.answer{font-size:30px;font-weight:850;color:#74ecc6}.btn,.option{width:100%;padding:15px;border-radius:14px;border:0;background:#75e6c0;color:#123127;font:inherit;font-weight:750;margin:7px 0;cursor:pointer}.btn.secondary,.option{background:#293d5a;color:#edf6ff}.option{text-align:left;border:1px solid #425878}.option.selected{border-color:#70e4be}.btn:disabled,.option:disabled{opacity:.6}.stats,.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1c2a42;border:1px solid #344663;text-align:center;padding:14px 4px;border-radius:16px}.stat strong{display:block;font-size:25px}.stat span{font-size:11px;color:#aab9ce}.ratings button{padding:14px 2px;border:0;border-radius:10px;font-weight:800}.ratings button:nth-child(1){background:#ffb9aa}.ratings button:nth-child(2){background:#ffe3aa}.ratings button:nth-child(3){background:#86e9bd}.nav{position:fixed;bottom:0;left:0;right:0;background:#111f32ec;padding:13px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid #3b4b65;display:flex;justify-content:center;gap:15px}.nav button{background:transparent;border:0;color:#b1c3db;font:inherit;font-size:13px;padding:8px}.nav button.active{color:#77e7c3;font-weight:800}.pill{color:#89e8c7;font-weight:800;font-size:12px;letter-spacing:1px}a{color:#85eac8}.small{font-size:13px}
</style></head><body><div class="wrap"><header class="brand">Vía <em>Panamá</em></header><main id="app"></main></div><nav class="nav" id="nav"></nav><script src="questions.js"></script><script>
const KEY='via-panama-v1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const save=()=>localStorage.setItem(KEY,JSON.stringify(progress));const app=document.querySelector('#app'),nav=document.querySelector('#nav');
let screen='home',deck=[],index=0,show=false,exam=[],answers=[],selection=null;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const record=q=>progress[q.id]||{};const due=q=>!record(q).due||record(q).due<=Date.now();const error=q=>record(q).wrong>0;const reviewed=()=>QUESTIONS.filter(q=>record(q).seen).length;
const pct=(a,b)=>b?Math.round(a*100/b):0;
function chrome(){nav.innerHTML=[['home','Inicio'],['study','Tarjetas'],['exam','Examen'],['errors','Errores']].map(([id,title])=>'<button class="'+(screen===id?'active':'')+'" data-go="'+id+'">'+title+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(s){screen=s;chrome();if(s==='home')home();else if(s==='study')startStudy('due');else if(s==='errors')startStudy('errors');else startExam()}
function home(){const count=QUESTIONS.filter(due).length;app.innerHTML='<div class="pill">ESTUDIO PERSONAL · PANAMÁ</div><h1>Aprende a conducir, sin memorizar a ciegas.</h1><p class="muted">Tarjetas, repaso espaciado y simulacro de 10 preguntas. Todo tu progreso queda en este dispositivo.</p><div class="stats"><div class="stat"><strong>'+QUESTIONS.length+'</strong><span>Tarjetas</span></div><div class="stat"><strong>'+reviewed()+'</strong><span>Vistas</span></div><div class="stat"><strong>'+count+'</strong><span>Por repasar</span></div></div><section class="panel"><h2>Tu sesión de hoy</h2><p class="muted">Repite lo pendiente o practica todas las tarjetas.</p><button class="btn" id="daily">Repasar ahora</button><button class="btn secondary" id="all">Todas las tarjetas</button></section><section class="panel"><h2>Simulacro</h2><p class="muted">10 preguntas de opción múltiple. Es un entrenamiento, no un examen oficial.</p><button class="btn secondary" id="test">Empezar examen</button></section><p class="muted small">Contenido educativo basado en conceptos de tránsito. No afiliado a Sertracen ni ATTT. <a href="https://www.sertracen.com.pa/wp-content/uploads/2023/10/preguntas-teoricas-de-examen.pdf" target="_blank" rel="noopener">Preguntas oficiales</a>.</p>';document.querySelector('#daily').onclick=()=>startStudy('due');document.querySelector('#all').onclick=()=>startStudy('all');document.querySelector('#test').onclick=startExam}
function startStudy(mode){screen=mode==='errors'?'errors':'study';chrome();deck=shuffle(QUESTIONS.filter(q=>mode==='errors'?error(q):mode==='due'?due(q):true));index=0;show=false;renderStudy()}
function renderStudy(){if(index>=deck.length){app.innerHTML='<h1>Sesión terminada</h1><p class="muted">Las tarjetas volverán cuando corresponda repasarlas.</p><button class="btn" id="back">Inicio</button>';document.querySelector('#back').onclick=()=>go('home');return}const q=deck[index];app.innerHTML='<div class="pill">TARJETAS · '+(index+1)+' / '+deck.length+'</div><div class="flash"><div class="muted small">'+q.topic+'</div><div class="question">'+q.q+'</div>'+(show?'<div class="answer">'+q.a+'</div>':'<div class="muted small">Recuerda la respuesta antes de verla</div>')+'</div>'+(show?'<div class="ratings"><button data-grade="again">Olvidé</button><button data-grade="hard">Difícil</button><button data-grade="good">Lo sé</button></div>':'<button class="btn" id="reveal">Mostrar respuesta</button>')+'<button class="btn secondary" id="back">Volver</button>';const back=document.querySelector('#back');back.onclick=()=>go('home');if(!show)document.querySelector('#reveal').onclick=()=>{show=true;renderStudy()};else document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{const level=b.dataset.grade;const before=record(q);const intervals={again:60000,hard:86400000,good:259200000};progress[q.id]={...before,seen:true,wrong:(before.wrong||0)+(level==='again'?1:0),due:Date.now()+intervals[level]};save();index++;show=false;renderStudy()})}
function startExam(){screen='exam';chrome();exam=shuffle(QUESTIONS).slice(0,10);answers=[];index=0;selection=null;renderExam()}
function renderExam(){if(index>=exam.length){const score=answers.filter(x=>x.ok).length;app.innerHTML='<div class="pill">RESULTADO</div><h1>'+score+' / '+exam.length+'</h1><p class="muted">'+pct(score,exam.length)+'% de respuestas correctas</p>'+answers.filter(x=>!x.ok).map(x=>'<div class="panel"><strong>'+x.q.q+'</strong><p>Respuesta: <b>'+x.q.a+'</b></p></div>').join('')+'<button class="btn" id="again">Repetir examen</button>';document.querySelector('#again').onclick=startExam;return}const q=exam[index],wrong=shuffle(QUESTIONS.filter(x=>x.a!==q.a)).slice(0,3).map(x=>x.a),opts=shuffle([q.a,...wrong]);app.innerHTML='<div class="pill">SIMULACRO · '+(index+1)+' / '+exam.length+'</div><div class="panel"><div class="question">'+q.q+'</div></div>'+opts.map((o,i)=>'<button class="option" data-answer="'+i+'">'+o+'</button>').join('')+'<button class="btn" id="next" disabled>Confirmar</button><p class="muted small">Cuestionario de práctica, no copia del examen oficial.</p>';selection=null;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selection=b.textContent;document.querySelectorAll('.option').forEach(o=>o.classList.toggle('selected',o===b));document.querySelector('#next').disabled=false});document.querySelector('#next').onclick=()=>{if(selection===null)return;const ok=selection===q.a;answers.push({q,ok});if(!ok){const old=record(q);progress[q.id]={...old,seen:true,wrong:(old.wrong||0)+1,due:Date.now()};save()}index++;renderExam()}}
chrome();home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
